name: QuantBot CI  (lint only — deploys are pull-based, see deploy/)

on:
  push:
    branches: [main]

jobs:
  # ── 1. Lint — catches syntax errors BEFORE touching the live server ──
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax errors only (fail the build on real errors)
        run: |
          flake8 bot.py corpus_manager.py dashboard.py notifier.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compile check all Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile corpus_manager.py
          python -m py_compile dashboard.py
          python -m py_compile notifier.py
          echo "All files compile OK"

  # ── 2. Deploy — REMOVED 2026-09-06, replaced by a pull-based deployer ──
  #
  # This job used to scp to the VM and restart containers over ssh. It cannot
  # work any more and was failing on every push:
  #
  #   The OCI security list allows SSH from ONE home IP (my_ip_cidr). GitHub
  #   Actions runners come from 5,625 published IPv4 ranges; OCI caps a
  #   security list at 200 ingress rules — 5.6x over the hard limit — and the
  #   list rotates weekly. Allowing them would also mean trusting ~28M
  #   addresses, which is not meaningfully safer than 0.0.0.0/0. A
  #   self-hosted runner is ruled out because this repo is PUBLIC: a fork's
  #   pull request could execute code on the box holding the Binance keys.
  #
  # The VM now PULLS instead. `deploy/quantbot-pull-deploy.sh` runs on a
  # systemd timer, checks origin/main, and rebuilds only the changed services.
  # Consequences worth knowing:
  #
  #   * No inbound port and no ssh key in GitHub. ORACLE_HOST, ORACLE_USER and
  #     ORACLE_SSH_KEY are no longer used by CI and can be deleted.
  #   * The open-position gate now FAILS CLOSED. The old one here ran
  #     `docker exec ... 2>/dev/null || echo "none"`, so any error was
  #     swallowed as "no position" and CI would restart the bot mid-trade
  #     (CLAUDE.md 7.2 #1). The new probe runs locally and treats any failure
  #     as "position open".
  #   * Deploys are eventually-consistent (<=5 min) rather than instant, which
  #     is irrelevant at this project's deploy frequency.
  #
  # This workflow is now a LINT GATE only. It still blocks nothing from being
  # pulled — the VM deploys whatever is on main — so a red build here means
  # "go fix main", not "the deploy stopped".
