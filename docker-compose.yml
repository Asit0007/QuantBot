# One shared volume for all state files.
# bot.py writes → notifier.py and dashboard.py read.
volumes:
  quantbot_data:

services:

  bot:
    build:
      context: .
      target: bot
    container_name: quantbot_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - quantbot_data:/app/data
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,sys,os; s=json.load(open(os.environ['DATA_DIR']+'/bot_state.json')); sys.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  notifier:
    build:
      context: .
      target: notifier
    container_name: quantbot_notifier
    restart: unless-stopped
    env_file: .env
    volumes:
      - quantbot_data:/app/data
    depends_on:
      - bot
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: quantbot_dashboard
    restart: unless-stopped
    # NOT `env_file: .env`. This is the only container the public internet can
    # reach (nginx:8888 -> quantbot.asitminz.com), and the dashboard is read-only:
    # it renders state files off the shared volume and never talks to an exchange.
    # Handing it the whole .env put BINANCE_API_KEY/SECRET and TELEGRAM_BOT_TOKEN
    # in the address space of the one process an attacker can reach, to be read by
    # nothing -- dashboard.py touches six env vars in total, and these are the only
    # three that aren't already correct in the image
    # (verify: `grep -n 'getenv\|environ' dashboard.py`).
    #
    # The other three -- DATA_DIR, DASHBOARD_HOST, DASHBOARD_PORT -- are left to the
    # Dockerfile's `dashboard` stage, which sets them to the values a container needs.
    # Leaving them out also fixes a quiet bug: `.env` carries DATA_DIR=. for running
    # dashboard.py on bare metal, and env_file was overriding the image's /app/data
    # with it, so a local `docker compose up` read state from the wrong directory.
    environment:
      LEVERAGE:             ${LEVERAGE:-5}
      EXIT_MODEL:           ${EXIT_MODEL:-stop}
      DASHBOARD_REFRESH_MS: ${DASHBOARD_REFRESH_MS:-15000}
    volumes:
      - quantbot_data:/app/data
    ports:
      - "127.0.0.1:8050:8050"   # only on localhost — nginx proxies externally
    depends_on:
      - bot
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  nginx:
    image: nginx:alpine
    container_name: quantbot_nginx
    restart: unless-stopped
    ports:
      - "8888:8888"    # dashboard — IP-only mode (no SSL required)
      # - "80:80"      # nginx has no `listen 80;`; public HTTPS is via the Cloudflare Tunnel
      # - "443:443"    # uncomment after adding SSL certs + domain
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro     # SSL certs (Let's Encrypt — optional)
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro   # basic auth — generate on the server, never commit
      - ./nginx/error_pages:/etc/nginx/error_pages:ro   # custom 401 / 50x pages
    depends_on:
      - dashboard
    logging:
      driver: "json-file"
      options: { max-size: "2m", max-file: "2" }