# nginx/nginx.conf — QuantBot reverse proxy
# ════════════════════════════════════════════════════════════════════
# DEFAULT: IP-only mode — no SSL required, works immediately on
# first deploy. Access dashboard at http://YOUR_VM_IP:8888
#
# Basic auth (nginx/htpasswd) is supported but currently commented out —
# dashboard is intentionally public during the building-in-public phase.
# See below to re-enable.
#
# TO ENABLE HTTPS later (after you have a domain):
#   1. Comment out the "IP-only" server block below
#   2. Uncomment the "HTTPS mode" server blocks
#   3. Replace YOUR_DOMAIN with your actual domain
#   4. Run certbot to get SSL certs into nginx/certs/
#   5. Push — CI/CD will rebuild nginx automatically
# ════════════════════════════════════════════════════════════════════

# ── IP-only mode (default — works on first deploy, no domain needed) ──
# Basic auth is currently DISABLED — dashboard is intentionally public
# during the "building in public" phase (P&L/trades, no keys or secrets
# are ever rendered by dashboard.py). To lock it back down:
#   sudo apt install apache2-utils -y
#   htpasswd -c -B nginx/htpasswd admin        # -c only on first run (overwrites file)
#   chmod 600 nginx/htpasswd
# then uncomment the two auth_basic lines below and redeploy.
server {
    listen 8888;
    server_name _;

    server_tokens off;   # don't leak the nginx version in error pages / headers

    error_page 401      /401.html;
    error_page 502 503 504 /50x.html;
    location = /401.html { root /etc/nginx/error_pages; internal; }
    location = /50x.html { root /etc/nginx/error_pages; internal; }

    location / {
        # auth_basic           "QuantBot Dashboard";
        # auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass         http://dashboard:8050;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

